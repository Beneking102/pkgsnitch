[package]
name = "pkgsnitch"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Behavioral diff for package updates: see what a new version does at install and import time that the old one did not."
authors = ["Bene Pankratz"]
license = "MIT"
repository = "https://github.com/Beneking102/pkgsnitch"
readme = "README.md"
keywords = ["security", "supply-chain", "npm", "sandbox", "diff"]
categories = ["command-line-utilities", "development-tools"]
# The crate holds what is needed to build the binary. Recorded traces, the
# demo packages and the CI and watch setup stay in the repository.
exclude = ["tests/", "demo/", "docs/", "watch/", ".github/", "action.yml"]

[dependencies]
anstream = "0.6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
