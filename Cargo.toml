[package]
name = "pkgsnitch"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Behavioral diff for package updates: see what a new version does at install and import time that the old one did not."
license = "MIT"
keywords = ["security", "supply-chain", "npm", "sandbox", "diff"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anstream = "0.6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
