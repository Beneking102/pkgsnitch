name: pkgsnitch
description: Behavioral diff for dependency updates. Flags pull requests whose new package versions start reading secrets, phoning home or running new commands.
author: Bene Pankratz
branding:
  icon: shield
  color: red

inputs:
  lockfile:
    description: Path to the package-lock.json to review.
    default: package-lock.json
  base-ref:
    description: Git ref holding the lockfile before the change. Defaults to the pull request's base branch.
    default: ""
  fail-on:
    description: Fail the job when a finding is at least this severe (info, low, medium, high, critical).
    default: high
  max:
    description: Evaluate at most this many changed packages.
    default: "20"
  comment:
    description: Post the report as a pull request comment, updated in place on later runs. Needs `pull-requests: write`.
    default: "true"
  token:
    description: Token used to comment.
    default: ${{ github.token }}

outputs:
  report:
    description: Path to the Markdown report.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    # The action's own checkout is the pkgsnitch source at the ref you pinned.
    - name: Install pkgsnitch
      shell: bash
      run: cargo install --locked --path "$GITHUB_ACTION_PATH"

    - name: Compare lockfiles
      id: run
      shell: bash
      env:
        LOCKFILE: ${{ inputs.lockfile }}
        BASE_REF: ${{ inputs.base-ref || github.base_ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX: ${{ inputs.max }}
        COMMENT: ${{ inputs.comment }}
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$BASE_REF" ]; then
          echo "::error::pkgsnitch needs a base ref: run it on pull_request events or set the base-ref input."
          exit 2
        fi
        git fetch --quiet --depth=1 origin "$BASE_REF"
        base="$RUNNER_TEMP/pkgsnitch-base-lock.json"
        report="$RUNNER_TEMP/pkgsnitch-report.md"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        if ! git show "FETCH_HEAD:$LOCKFILE" > "$base" 2>/dev/null; then
          echo "No $LOCKFILE on $BASE_REF; nothing to compare." | tee "$report" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        status=0
        pkgsnitch lock "$base" "$LOCKFILE" --format markdown --fail-on "$FAIL_ON" --max "$MAX" > "$report" || status=$?
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        if [ "$COMMENT" = true ] && [ -n "$PR" ]; then
          gh pr comment "$PR" --body-file "$report" --edit-last --create-if-none \
            || echo "::warning::pkgsnitch could not comment on the pull request (is pull-requests: write granted?)"
        fi
        exit "$status"
