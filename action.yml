name: pkgsnitch
description: Behavioral diff for dependency updates. Flags pull requests whose new package versions start reading secrets, phoning home or running new commands.
author: Bene Pankratz
branding:
  icon: shield
  color: red

inputs:
  command:
    description: "`lock` reviews what a pull request changes in the lockfile. `updates` finds newer versions of the direct dependencies and tests them, for a scheduled run."
    default: lock
  lockfile:
    description: "Path to the lockfile: package-lock.json, yarn.lock, pnpm-lock.yaml, requirements.txt, poetry.lock or uv.lock. `updates` needs package-lock.json or requirements.txt."
    default: package-lock.json
  base-ref:
    description: "`lock`: git ref holding the lockfile before the change. Defaults to the pull request's base branch."
    default: ""
  level:
    description: "`updates`: largest version jump to propose (patch, minor, major)."
    default: major
  fail-on:
    description: Fail the job when a finding is at least this severe (info, low, medium, high, critical).
    default: high
  max:
    description: Evaluate at most this many packages.
    default: "20"
  comment:
    description: "Post the report as a pull request comment, updated in place on later runs. Needs the pull-requests write permission."
    default: "true"
  token:
    description: Token used to comment.
    default: ${{ github.token }}

outputs:
  report:
    description: Path to the Markdown report.
    value: ${{ steps.run.outputs.report }}
  sarif:
    description: Path to the same findings as SARIF, for github/codeql-action/upload-sarif.
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: composite
  steps:
    # Pinned to a release tag, the ready-made binary is downloaded. Otherwise
    # pkgsnitch is built from the action's own checkout, which takes a minute.
    - name: Install pkgsnitch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        bin="$RUNNER_TEMP/pkgsnitch-bin"
        if [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ARCH" = X64 ] && [ -n "$ACTION_REPO" ] && [ -n "$ACTION_REF" ] \
            && gh release download "$ACTION_REF" --repo "$ACTION_REPO" --pattern pkgsnitch-linux-x86_64 --dir "$bin" 2>/dev/null; then
          mv "$bin/pkgsnitch-linux-x86_64" "$bin/pkgsnitch"
          chmod +x "$bin/pkgsnitch"
          echo "$bin" >> "$GITHUB_PATH"
          echo "pkgsnitch: using the $ACTION_REF release binary"
        else
          cargo install --locked --path "$GITHUB_ACTION_PATH"
          echo "pkgsnitch: built from source"
        fi

    - name: Run pkgsnitch
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        LOCKFILE: ${{ inputs.lockfile }}
        BASE_REF: ${{ inputs.base-ref || github.base_ref }}
        LEVEL: ${{ inputs.level }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX: ${{ inputs.max }}
        COMMENT: ${{ inputs.comment }}
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        report="$RUNNER_TEMP/pkgsnitch-report.md"
        sarif="$RUNNER_TEMP/pkgsnitch.sarif"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"

        case "$COMMAND" in
          lock)
            if [ -z "$BASE_REF" ]; then
              echo "::error::pkgsnitch needs a base ref: run it on pull_request events or set the base-ref input."
              exit 2
            fi
            git fetch --quiet --depth=1 origin "$BASE_REF"
            set -- lock --since FETCH_HEAD "$LOCKFILE"
            ;;
          updates)
            set -- updates "$LOCKFILE" --level "$LEVEL"
            ;;
          *)
            echo "::error::unknown command '$COMMAND' (use lock or updates)"
            exit 2
            ;;
        esac

        status=0
        pkgsnitch "$@" --format markdown --fail-on "$FAIL_ON" --max "$MAX" > "$report" || status=$?
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        # The observations are cached, so the second format costs nothing.
        pkgsnitch "$@" --format sarif --fail-on "$FAIL_ON" --max "$MAX" > "$sarif" 2>/dev/null || true
        if [ "$COMMENT" = true ] && [ -n "$PR" ]; then
          gh pr comment "$PR" --body-file "$report" --edit-last --create-if-none \
            || echo "::warning::pkgsnitch could not comment on the pull request (is pull-requests: write granted?)"
        fi
        exit "$status"
