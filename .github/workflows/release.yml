name: release

# Pushing a tag like v0.1.0 builds the binaries and attaches them to a
# GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static, so that it runs on any distribution, Alpine included.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: pkgsnitch-linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: pkgsnitch-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: pkgsnitch-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Collect the binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/pkgsnitch"
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.name }}"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The jobs of the matrix race to create the release; whoever loses
          # finds it already there, which is just as good.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.name }}" --clobber
