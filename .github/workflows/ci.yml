name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The real thing: build the sandbox and catch the simulated hijack.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release
      - name: Pack the demo pair
        run: |
          (cd demo/1.0.0 && npm pack)
          (cd demo/1.0.1 && npm pack)
      - name: The hijacked release must be flagged as critical
        run: |
          set +e
          target/release/pkgsnitch diff --format json \
            demo/1.0.0/pkgsnitch-demo-leftpad-1.0.0.tgz \
            demo/1.0.1/pkgsnitch-demo-leftpad-1.0.1.tgz > report.json
          status=$?
          cat report.json
          test "$status" -eq 1
          test "$(jq -r .verdict report.json)" = critical
          # Honeytokens, sinkhole and process tracking must each have fired.
          jq -e '.findings[] | select(.title == "reads file" and (.target | contains(".ssh/id_rsa")))' report.json
          jq -e '.findings[] | select(.title == "DNS lookup" and (.target | contains("pkgsnitch-demo.invalid")))' report.json
          jq -e '.findings[] | select(.title == "runs command" and (.target | startswith("curl ")))' report.json
          # The planted token must be seen leaving, in the request body and as a DNS name.
          jq -e '.findings[] | select(.title == "exfiltrates secret" and (.target | startswith("HTTP request")))' report.json
          jq -e '.findings[] | select(.title == "exfiltrates secret" and (.target | startswith("DNS lookup")))' report.json
      - name: An unchanged release must be clean
        run: |
          target/release/pkgsnitch diff \
            demo/1.0.0/pkgsnitch-demo-leftpad-1.0.0.tgz \
            demo/1.0.0/pkgsnitch-demo-leftpad-1.0.0.tgz

  # Real packages from the registry: the patch-management commands.
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release
      - name: A harmless update is clean
        run: |
          target/release/pkgsnitch diff left-pad 1.2.0 1.3.0 --format json > diff.json
          cat diff.json
          jq -e '.verdict == "info" or .verdict == "low"' diff.json
      - name: lock evaluates every change between two lockfiles
        run: |
          target/release/pkgsnitch lock tests/fixtures/locks/base.json tests/fixtures/locks/head.json --format json > plan.json
          cat plan.json
          jq -e '.outcomes | length == 2' plan.json
          jq -e '[.outcomes[] | .advice] == ["apply", "apply"]' plan.json
          # The same change written as a yarn.lock gives the same plan.
          target/release/pkgsnitch lock tests/fixtures/locks/yarn-base.lock tests/fixtures/locks/yarn-head.lock --format json > yarn.json
          jq -e '[.outcomes[] | .name] == ["is-number", "left-pad"]' yarn.json
          jq -e '[.outcomes[] | .advice] == ["apply", "apply"]' yarn.json
      - name: updates finds and evaluates newer versions
        run: |
          mkdir project && cp tests/fixtures/locks/base.json project/package-lock.json
          target/release/pkgsnitch updates project --format json > updates.json
          cat updates.json
          jq -e '.outcomes[] | select(.name == "left-pad" and .from == "1.2.0" and .to == "1.3.0") | .advice == "apply"' updates.json
          target/release/pkgsnitch updates project
          # left-pad has no newer 1.2.x, so a patch-only plan is empty.
          target/release/pkgsnitch updates project --level patch --format json > patch.json
          jq -e '.outcomes | length == 0' patch.json
      - name: scan reports a package with an install script
        run: |
          set +e
          target/release/pkgsnitch scan esbuild@0.21.5 --format json > scan.json
          echo "exit status: $?"
          set -e
          cat scan.json
          jq -e '.findings[] | select(.title == "has install script")' scan.json

  # Python packages from PyPI.
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release
      - name: A harmless update of a wheel is clean
        run: |
          target/release/pkgsnitch diff pypi:idna 3.6 3.7 --format json > diff.json
          cat diff.json
          jq -e '.package == "idna" and .old == "3.6" and .new == "3.7"' diff.json
          jq -e '.verdict == "info" or .verdict == "low"' diff.json
      - name: scan of a wheel with dependencies
        run: |
          set +e
          target/release/pkgsnitch scan pypi:requests==2.32.3 --format json > wheel.json
          echo "exit status: $?"
          set -e
          cat wheel.json
          jq -e '.package == "requests" and .new == "2.32.3"' wheel.json
          jq -e '[.phases[] | .syscalls > 0] | all' wheel.json
      - name: scan of a source distribution runs its build script
        run: |
          set +e
          target/release/pkgsnitch scan pypi:docopt==0.6.2 --format json > sdist.json
          echo "exit status: $?"
          set -e
          cat sdist.json
          jq -e '.findings[] | select(.title == "has install script")' sdist.json
          # pip cleaning up its own build directory must not look like the
          # package deleting files in the project.
          jq -e '[.findings[] | select(.title == "deletes file" or .title == "writes file")] | length == 0' sdist.json
      - name: Pack the Python demo pair
        run: |
          for v in 1.0.0 1.0.1; do
            tar -czf "pkgsnitch_demo_slugify-$v.tar.gz" -C demo/pypi --transform "s,^$v,pkgsnitch_demo_slugify-$v," "$v"
          done
      - name: The hijacked Python release must be flagged as critical
        run: |
          set +e
          target/release/pkgsnitch diff --format json \
            pypi:pkgsnitch_demo_slugify-1.0.0.tar.gz \
            pypi:pkgsnitch_demo_slugify-1.0.1.tar.gz > hijack.json
          status=$?
          set -e
          cat hijack.json
          test "$status" -eq 1
          jq -e '.verdict == "critical" and .package == "pkgsnitch-demo-slugify"' hijack.json
          jq -e '.findings[] | select(.title == "reads file" and (.target | contains(".ssh/id_rsa")))' hijack.json
          jq -e '.findings[] | select(.title == "exfiltrates secret" and (.target | startswith("HTTP request")))' hijack.json
          jq -e '.findings[] | select(.title == "exfiltrates secret" and (.target | startswith("DNS lookup")))' hijack.json
          jq -e '.findings[] | select(.title == "runs command" and (.target | startswith("curl ")))' hijack.json
          # The module must really be imported: its lookup happens at import time.
          jq -e '.findings[] | select(.phase == "import" and .title == "DNS lookup" and (.target | startswith("telemetry.")))' hijack.json
      - name: An unchanged Python release must be clean
        run: |
          target/release/pkgsnitch diff \
            pypi:pkgsnitch_demo_slugify-1.0.0.tar.gz \
            pypi:pkgsnitch_demo_slugify-1.0.0.tar.gz
      - name: Patch plan and lockfile review for requirements.txt
        run: |
          mkdir pyproject && printf 'idna==3.6\n' > pyproject/requirements.txt
          target/release/pkgsnitch updates pyproject --format json > pyupdates.json
          cat pyupdates.json
          jq -e '.outcomes[] | select(.name == "idna" and .ecosystem == "pypi" and .from == "3.6") | .advice == "apply"' pyupdates.json
          target/release/pkgsnitch updates pyproject
          printf 'idna==3.7\n' > newer.txt
          target/release/pkgsnitch lock pyproject/requirements.txt newer.txt --format json > pylock.json
          cat pylock.json
          jq -e '.outcomes | length == 1' pylock.json
          jq -e '.outcomes[0] | .name == "idna" and .to == "3.7" and .advice == "apply"' pylock.json
